[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sakshamm21/Vaani"
authors = ["sakshamm21"]

[workspace.dependencies]
vaani-core = { path = "crates/vaani-core" }
vaani-audio = { path = "crates/vaani-audio" }
vaani-stt = { path = "crates/vaani-stt" }
vaani-llm = { path = "crates/vaani-llm" }
vaani-text = { path = "crates/vaani-text" }
vaani-hotkey = { path = "crates/vaani-hotkey" }
vaani-inject = { path = "crates/vaani-inject" }
vaani-platform = { path = "crates/vaani-platform" }
vaani-store = { path = "crates/vaani-store" }
vaani-models = { path = "crates/vaani-models" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
directories = "6"
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tempfile = "3"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

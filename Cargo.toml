[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sakshamm21/Vaani"
authors = ["sakshamm21"]

[workspace.dependencies]
vaani-core = { path = "crates/vaani-core" }
vaani-audio = { path = "crates/vaani-audio" }
vaani-stt = { path = "crates/vaani-stt" }
vaani-llm = { path = "crates/vaani-llm" }
vaani-text = { path = "crates/vaani-text" }
vaani-hotkey = { path = "crates/vaani-hotkey" }
vaani-inject = { path = "crates/vaani-inject" }
vaani-platform = { path = "crates/vaani-platform" }
vaani-store = { path = "crates/vaani-store" }
vaani-models = { path = "crates/vaani-models" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
directories = "6"
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tempfile = "3"
postcard = { version = "1", features = ["use-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "blocking", "json", "multipart", "stream"] }
tar = "0.4"
bzip2 = "0.5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
cpal = "0.18"
rubato = "5"
rustix = { version = "1", features = ["event"] }
x11rb = { version = "0.14", features = ["xinput", "xtest"] }
sherpa-onnx = "2"
crossbeam-channel = "0.5"
evdev = "0.13"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
hound = "3.5"
gtk4 = "0.11"
gdk4-x11 = "0.11"
ksni = "0.3"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

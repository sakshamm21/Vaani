# Catalogue of local speech-to-text models Vaani can download and run.
# Adding a model is one [[model]] entry. `archive` is a sherpa-onnx release asset name
# (https://github.com/k2-fsa/sherpa-onnx/releases/tag/asr-models) unless `url` is given.
# `kind` picks the engine: nemo_transducer, whisper, moonshine, sense_voice.

[[model]]

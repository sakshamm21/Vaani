[package]
name = "vaani-app"
description = "The Vaani app: background service, overlay, tray, settings and CLI"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vaani"
path = "src/main.rs"

[dependencies]
vaani-core.workspace = true
vaani-platform.workspace = true
vaani-audio.workspace = true
vaani-stt.workspace = true
vaani-text.workspace = true
vaani-llm.workspace = true
vaani-hotkey.workspace = true
vaani-inject.workspace = true
vaani-store.workspace = true
vaani-models.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
gtk4.workspace = true
chrono.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
gdk4-x11.workspace = true
ksni.workspace = true
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
vaani-worker.workspace = true
gdk4-win32.workspace = true
pango = { version = "0.22", features = ["v1_56"] }
tray-icon.workspace = true
tauri-winrt-notification.workspace = true
windows-registry.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported Ubuntu, so the binaries also run on Mint 21 and Debian 12.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-4-dev clang cmake rpm
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/PKGBUILD
            dist/vaani-bin.install
            dist/SHA256SUMS

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GTK
        uses: ./.github/actions/gtk-windows
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          ./scripts/package-windows.ps1
      # The same end-to-end check as CI, on the exact installer that is published.
      - name: Install, dictate into Notepad, uninstall
        timeout-minutes: 10
        shell: powershell
        run: |
          $setup = (Get-ChildItem dist\vaani-*-setup.exe).FullName
          ./scripts/windows-smoke-test.ps1 -Setup $setup -Shots screenshots
      - name: Store package installs, starts and dictates
        timeout-minutes: 10
        shell: powershell
        run: ./scripts/windows-msix-test.ps1 -Msix (Get-ChildItem dist\*.msix).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows
      # For Partner Center, not the GitHub release: the Store signs it.
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/*.msix

  # One draft release, created only once every file is built and tested.
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Vaani ${GITHUB_REF_NAME#v}" --generate-notes --draft

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-4-dev
      - uses: Swatinem/rust-cache@v2
      - name: Drop a partly restored sherpa-onnx download
        # The cache can bring back its folder without the library inside, which breaks linking.
        run: find target -maxdepth 2 -name sherpa-onnx-prebuilt -prune -exec rm -rf {} + || true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Build the release packages the way the release workflow does.
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-4-dev clang cmake rpm
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  # Install each package on the distributions it is for, and check that it starts.
  install:
    needs: packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", setup: "apt-get update && apt-get install -y ./vaani_*.deb" }
          - { image: "ubuntu:24.04", setup: "apt-get update && apt-get install -y ./vaani_*.deb" }
          - { image: "fedora:latest", setup: "dnf install -y ./vaani-*.rpm" }
          - { image: "opensuse/tumbleweed", setup: "zypper --non-interactive install --allow-unsigned-rpm ./vaani-*.rpm" }
          - { image: "opensuse/leap:15.6", setup: "zypper --non-interactive install --allow-unsigned-rpm ./vaani-*.rpm" }
          - { image: "archlinux:latest", setup: "pacman -Syu --noconfirm gtk4 alsa-lib libx11 libxi libxcb libxkbcommon && tar xzf vaani-*.tar.gz && cp -a vaani-*-linux/bin/. /usr/local/bin/" }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Install
        run: ${{ matrix.setup }}
      - name: Run
        run: vaani --version && vaani doctor

  # Windows: lint, test, build the installer and portable zip, then install and use them.
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: GTK
        uses: ./.github/actions/gtk-windows
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Package
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows
      - name: Install, dictate into Notepad, uninstall
        shell: powershell
        run: |
          $setup = (Get-ChildItem dist\vaani-*-setup.exe).FullName
          ./scripts/windows-smoke-test.ps1 -Setup $setup -Shots screenshots
      - name: Portable zip starts
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist\*-portable.zip).FullName $env:RUNNER_TEMP\portable
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$env:RUNNER_TEMP\portable\Vaani\bin\vaani.exe" --version | Out-String
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: screenshots/

  # The from-source install script on distributions with other package managers.
  install-script:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "archlinux:latest", "opensuse/tumbleweed"]
    container: ${{ matrix.image }}
    steps:
      - name: Tools the script expects
        run: |
          if command -v dnf; then dnf install -y curl tar gzip findutils
          elif command -v pacman; then pacman -Syu --noconfirm curl tar gzip
          else
            # openSUSE mirrors are sometimes mid-sync; try again.
            for i in 1 2 3; do zypper --non-interactive install curl tar gzip && break; sleep 20; done
          fi
      - uses: actions/checkout@v4
      - name: Install from source
        run: ./scripts/install.sh
      - name: Run
        run: ~/.local/bin/vaani --version
